name: Build Portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Portable Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build portable Windows executable
        run: npm run tauri -- build --no-bundle

      - name: Verify GUI-only Windows executable
        shell: pwsh
        run: ./src-tauri/tests/verify_windows_gui.ps1 -ExecutablePath ./src-tauri/target/release/hexforge.exe

      - name: Upload portable executable
        uses: actions/upload-artifact@v6
        with:
          name: HexForge-windows-x64-portable
          path: src-tauri/target/release/hexforge.exe
          if-no-files-found: error

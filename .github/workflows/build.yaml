name: Build Portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Portable Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check native workspace
        run: cargo check --locked --workspace

      - name: Test core, controller and native interface
        run: cargo test --locked --workspace

      - name: Test preference import safeguards
        run: cargo test --locked -p hexforge-native --example import_results_preferences

      - name: Build portable Windows executable
        run: cargo build --locked --release -p hexforge-native --bin hexforge

      - name: Verify GUI-only Windows executable
        shell: pwsh
        run: ./scripts/verify_windows_gui.ps1 -ExecutablePath ./target/release/hexforge.exe

      - name: Verify EXE-only portable distribution
        shell: pwsh
        run: |
          ./scripts/verify_portable_native.ps1 `
            -Executable "$env:GITHUB_WORKSPACE\target\release\hexforge.exe" `
            -Destination "$env:RUNNER_TEMP\HexForge-portable" `
            -Report "$env:RUNNER_TEMP\HexForge-portable-preflight.json" -PrepareOnly

      - name: Upload portable executable
        uses: actions/upload-artifact@v6
        with:
          name: HexForge-windows-x64-portable
          path: target/release/hexforge.exe
          if-no-files-found: error

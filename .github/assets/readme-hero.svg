<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" fill="none" role="img" aria-labelledby="title description">
  <title id="title">HexForge — Every byte. In plain sight.</title>
  <desc id="description">A concept illustration of a binary workbench on a graphite background. A PNG byte grid has a blue width selection and an amber height edit. A structured view decodes width as one and height as two. The original file stays intact.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10151D"/>
      <stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(1120 200) rotate(120) scale(500 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6FEB" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientTransform="translate(210 600) rotate(-55) scale(360 570)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0883E" stop-opacity=".09"/>
      <stop offset="1" stop-color="#F0883E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBA7A"/>
      <stop offset="1" stop-color="#F0883E"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8290A6" fill-opacity=".1"/>
    </pattern>
    <pattern id="minimap" width="34" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 2h8m4 0h14m-23 4h15m5 0h9" stroke="#61738B" stroke-opacity=".55" stroke-width="2"/>
    </pattern>
    <clipPath id="coverClip"><rect x="1" y="1" width="1438" height="658" rx="24"/></clipPath>
    <clipPath id="windowClip"><rect x="640" y="72" width="728" height="484" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#coverClip)">
    <rect width="1440" height="660" fill="url(#background)"/>
    <rect width="1440" height="660" fill="url(#blueGlow)"/>
    <rect width="1440" height="660" fill="url(#amberGlow)"/>
    <rect x="600" width="840" height="590" fill="url(#dots)"/>
    <path d="M600 0v588M72 588h1296" stroke="#8192AB" stroke-opacity=".14"/>

    <!-- Brand and editorial headline. -->
    <g transform="translate(72 68)">
      <rect width="44" height="44" rx="12" fill="#182535" stroke="#2B4260"/>
      <path d="M13 12v20m18-20v20M13 22h18" stroke="#6DAEFF" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="13" cy="12" r="2.5" fill="#FFB878"/>
      <circle cx="31" cy="32" r="2.5" fill="#FFB878"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="132" y="86" fill="#F1F5FB" font-size="17" font-weight="700" letter-spacing="2">HEXFORGE</text>
      <text x="132" y="108" fill="#8F9DB1" font-size="11" letter-spacing="2.1">BINARY WORKBENCH</text>
      <text x="68" y="224" fill="#F1F5FB" font-size="76" font-weight="700" letter-spacing="-3.5">Every byte.</text>
      <text x="68" y="310" fill="url(#accent)" font-size="76" font-weight="700" letter-spacing="-3.5">In plain sight.</text>
      <text x="72" y="365" fill="#B4C0D0" font-size="21">A closer look at your binaries.</text>
      <text x="72" y="411" fill="#8F9DB1" font-size="18">Native Windows. Fully offline.</text>
      <text x="72" y="440" fill="#8F9DB1" font-size="18">Your original file stays intact.</text>
    </g>
    <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" letter-spacing="1.2">
      <rect x="72" y="486" width="118" height="32" rx="6" fill="#192332" stroke="#304159"/>
      <text x="88" y="507" fill="#A8C9F6">RUST + egui</text>
      <rect x="202" y="486" width="144" height="32" rx="6" fill="#251E1B" stroke="#544031"/>
      <text x="218" y="507" fill="#F6B27B">PORTABLE .EXE</text>
    </g>

    <!-- Illustration, intentionally distinct from a product screenshot. -->
    <rect x="632" y="82" width="744" height="488" rx="22" fill="#05080D" fill-opacity=".35"/>
    <g clip-path="url(#windowClip)">
      <rect x="640" y="72" width="728" height="484" fill="#111820"/>
      <rect x="640" y="72" width="728" height="49" fill="#1A2330"/>
      <rect x="664" y="89" width="16" height="16" rx="4" fill="#263D5D"/>
      <path d="M669 93v8m6-8v8m-6-4h6" stroke="#79B4FF" stroke-width="1.5"/>
      <text x="691" y="102" fill="#D7E0EC" font-family="Segoe UI, Arial, sans-serif" font-size="13">HexForge</text>
      <g stroke="#8190A5" stroke-width="1.2">
        <path d="M1254 97h10"/>
        <rect x="1296" y="92" width="9" height="9"/>
        <path d="m1336 92 9 9m0-9-9 9"/>
      </g>
      <path d="M640 121h728" stroke="#2A3545"/>

      <g font-family="Consolas, DejaVu Sans Mono, monospace">
        <rect x="658" y="133" width="168" height="29" rx="5" fill="#202D3E"/>
        <circle cx="674" cy="148" r="3" fill="#F6AD72"/>
        <text x="686" y="152" fill="#D6E2F2" font-size="12">png-ihdr.bin</text>
        <text x="1338" y="152" fill="#8A9AB0" font-size="11" text-anchor="end">IN-MEMORY COPY</text>
        <g fill="#7D90AB" font-size="10" letter-spacing="1.5">
          <text x="666" y="194">OFFSET</text>
          <text x="800" y="194">HEX BYTES</text>
          <text x="1080" y="194">ASCII</text>
        </g>
        <path d="M658 208h552m-426-29v180m278-180v180" stroke="#263141"/>

        <rect x="794" y="282" width="116" height="30" rx="4" fill="#1F6FEB"/>
        <rect x="1004" y="282" width="27" height="30" rx="4" fill="#F0883E"/>
        <rect x="1075" y="282" width="36" height="30" rx="4" fill="#1F6FEB" fill-opacity=".25"/>

        <text x="666" y="238" fill="#8496AF" font-size="15">00000000</text>
        <text y="238" fill="#D5DFEE" font-size="16"><tspan x="800">89</tspan><tspan x="830">50</tspan><tspan x="860">4E</tspan><tspan x="890">47</tspan><tspan x="920">0D</tspan><tspan x="950">0A</tspan><tspan x="980">1A</tspan><tspan x="1010">0A</tspan></text>
        <text x="1080" y="238" fill="#A6B7CE" font-size="15">.PNG....</text>
        <text x="666" y="272" fill="#8496AF" font-size="15">00000008</text>
        <text y="272" fill="#D5DFEE" font-size="16"><tspan x="800">00</tspan><tspan x="830">00</tspan><tspan x="860">00</tspan><tspan x="890">0D</tspan><tspan x="920">49</tspan><tspan x="950">48</tspan><tspan x="980">44</tspan><tspan x="1010">52</tspan></text>
        <text x="1080" y="272" fill="#A6B7CE" font-size="15">....IHDR</text>
        <text x="666" y="306" fill="#8496AF" font-size="15">00000010</text>
        <text y="306" fill="#D5DFEE" font-size="16"><tspan x="800" fill="#FFFFFF">00</tspan><tspan x="830" fill="#FFFFFF">00</tspan><tspan x="860" fill="#FFFFFF">00</tspan><tspan x="890" fill="#FFFFFF">01</tspan><tspan x="920">00</tspan><tspan x="950">00</tspan><tspan x="980">00</tspan><tspan x="1010" fill="#21160E" font-weight="700">02</tspan></text>
        <text x="1080" y="306" fill="#A6B7CE" font-size="15">........</text>
        <text x="666" y="340" fill="#8496AF" font-size="15">00000018</text>
        <text y="340" fill="#D5DFEE" font-size="16"><tspan x="800">08</tspan><tspan x="830">06</tspan><tspan x="860">00</tspan><tspan x="890">00</tspan><tspan x="920">00</tspan><tspan x="950">1F</tspan><tspan x="980">15</tspan><tspan x="1010">C4</tspan></text>
        <text x="1080" y="340" fill="#A6B7CE" font-size="15">........</text>

        <rect x="1234" y="180" width="109" height="180" rx="5" fill="#0D131C"/>
        <rect x="1244" y="191" width="88" height="157" fill="url(#minimap)"/>
        <rect x="1239" y="191" width="99" height="46" rx="3" fill="#1F6FEB" fill-opacity=".18" stroke="#5288CF" stroke-opacity=".6"/>
        <path d="M1336 285v22" stroke="#F0883E" stroke-width="2"/>

        <rect x="658" y="380" width="692" height="128" rx="8" fill="#17212E" stroke="#2A394E"/>
        <path d="M658 419h692" stroke="#2A394E"/>
        <text x="677" y="405" fill="#89A7CE" font-size="10" letter-spacing="1.8">DECODED STRUCTURE</text>
        <rect x="1259" y="391" width="74" height="18" rx="4" fill="#23354B"/>
        <text x="1296" y="404" fill="#A8C8F2" font-size="9" text-anchor="middle">BIG ENDIAN</text>
        <g font-size="13">
          <text x="678" y="450" fill="#CAD8EB">ihdr.width</text>
          <text x="890" y="450" fill="#7D90AB">u32</text>
          <text x="957" y="450" fill="#A5C9FF">1</text>
          <text x="1013" y="450" fill="#7D90AB">0x00000010</text>
          <text x="678" y="484" fill="#CAD8EB">ihdr.height</text>
          <text x="890" y="484" fill="#7D90AB">u32</text>
          <text x="957" y="484" fill="#FFB878">2</text>
          <text x="1013" y="484" fill="#7D90AB">0x00000014</text>
        </g>
        <path d="M640 523h728" stroke="#293447"/>
        <circle cx="668" cy="540" r="3" fill="#64C4A5"/>
        <text x="680" y="544" fill="#92A8C3" font-size="10">ORIGINAL PRESERVED</text>
        <text x="1338" y="544" fill="#F6B27B" font-size="10" text-anchor="end">1 BYTE MODIFIED</text>
      </g>
    </g>
    <rect x="640.5" y="72.5" width="727" height="483" rx="15.5" stroke="#3B4A60"/>

    <!-- A three-step reading rhythm. -->
    <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" letter-spacing="1.4">
      <text x="72" y="625" fill="#F6B27B">01</text>
      <text x="105" y="625" fill="#ACBAD0">INSPECT THE BYTES</text>
      <path d="M346 621h56m-5-4 5 4-5 4" stroke="#52617A"/>
      <text x="479" y="625" fill="#F6B27B">02</text>
      <text x="512" y="625" fill="#ACBAD0">UNDERSTAND THE STRUCTURE</text>
      <path d="M824 621h56m-5-4 5 4-5 4" stroke="#52617A"/>
      <text x="973" y="625" fill="#F6B27B">03</text>
      <text x="1006" y="625" fill="#ACBAD0">SAVE A SEPARATE COPY</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1439" height="659" rx="24" stroke="#2C3647"/>
</svg>

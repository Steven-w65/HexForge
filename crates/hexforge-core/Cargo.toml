[package]
name = "hexforge-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tempfile = "3"
thiserror = "2"
same-file = "1.0.6"

[dev-dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

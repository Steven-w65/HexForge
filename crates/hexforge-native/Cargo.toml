[package]
name = "hexforge-native"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hexforge"
path = "src/main.rs"

[dependencies]
hexforge-core = { path = "../hexforge-core" }
hexforge-controller = { path = "../hexforge-controller" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "accesskit"] }
rfd = { version = "0.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
raw-window-handle = "0.6"
ttf-parser = "0.25"

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
